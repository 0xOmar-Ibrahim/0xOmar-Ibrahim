<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Omar Ibrahim - Junior Penetration Tester" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="clip"><rect width="1200" height="300" rx="22"/></clipPath>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060912"/>
      <stop offset="0.6" stop-color="#0A1226"/>
      <stop offset="1" stop-color="#08202B"/>
    </linearGradient>

    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.65" stop-color="#E6FFF8"/>
      <stop offset="1" stop-color="#42E8C5"/>
    </linearGradient>

    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#42E8C5" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#42E8C5"/>
      <stop offset="1" stop-color="#1C75BC" stop-opacity="0"/>
    </linearGradient>

    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#7FA8C9" fill-opacity="0.16"/>
    </pattern>

    <radialGradient id="fade" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.35" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="dotmask"><rect width="1200" height="300" fill="url(#fade)"/></mask>

    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
  </defs>

  <g clip-path="url(#clip)">
    <!-- Base -->
    <rect width="1200" height="300" fill="url(#bg)"/>

    <!-- Soft animated glows -->
    <g filter="url(#blur)">
      <circle cx="980" cy="60" r="130" fill="#087F8C" opacity="0.55">
        <animateTransform attributeName="transform" type="translate" values="0 0; -50 30; 0 0" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1100" cy="270" r="120" fill="#1C75BC" opacity="0.4">
        <animateTransform attributeName="transform" type="translate" values="0 0; 40 -30; 0 0" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle cx="120" cy="300" r="110" fill="#42E8C5" opacity="0.18">
        <animateTransform attributeName="transform" type="translate" values="0 0; 60 -20; 0 0" dur="16s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Dot grid -->
    <rect width="1200" height="300" fill="url(#dots)" mask="url(#dotmask)"/>

    <!-- Left content -->
    <g font-family="'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace">
      <text x="72" y="84" font-size="14" font-weight="600" letter-spacing="4" fill="#42E8C5">
        // OFFENSIVE SECURITY
        <animate attributeName="opacity" values="0;1" dur="0.8s" fill="freeze"/>
      </text>
    </g>

    <text x="68" y="150" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="72" font-weight="800" letter-spacing="-1.5" fill="url(#name)">
      Omar Ibrahim
      <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
    </text>

    <text x="72" y="188" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-size="22" fill="#9FB3C8">
      Junior Penetration Tester
      <tspan fill="#42E8C5" dx="8">·</tspan>
      <tspan dx="8">Cairo, Egypt</tspan>
      <animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze"/>
    </text>

    <!-- Chips -->
    <g font-family="'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace" font-size="12.5" font-weight="600" letter-spacing="1">
      <g>
        <rect x="72" y="214" width="132" height="30" rx="15" fill="#42E8C5" fill-opacity="0.08" stroke="#42E8C5" stroke-opacity="0.45"/>
        <text x="138" y="233" text-anchor="middle" fill="#BFF6E9">WEB SECURITY</text>
      </g>
      <g>
        <rect x="214" y="214" width="146" height="30" rx="15" fill="#42E8C5" fill-opacity="0.08" stroke="#42E8C5" stroke-opacity="0.45"/>
        <text x="287" y="233" text-anchor="middle" fill="#BFF6E9">VULN RESEARCH</text>
      </g>
      <g>
        <rect x="370" y="214" width="92" height="30" rx="15" fill="#42E8C5" fill-opacity="0.08" stroke="#42E8C5" stroke-opacity="0.45"/>
        <text x="416" y="233" text-anchor="middle" fill="#BFF6E9">PYTHON</text>
      </g>
      <g>
        <rect x="472" y="214" width="62" height="30" rx="15" fill="#42E8C5" fill-opacity="0.08" stroke="#42E8C5" stroke-opacity="0.45"/>
        <text x="503" y="233" text-anchor="middle" fill="#BFF6E9">IoT</text>
      </g>
    </g>

    <!-- Terminal card -->
    <g>
      <rect x="760" y="52" width="368" height="196" rx="16" fill="#0B1222" fill-opacity="0.72" stroke="#42E8C5" stroke-opacity="0.28"/>
      <rect x="760" y="52" width="368" height="40" rx="16" fill="#FFFFFF" fill-opacity="0.04"/>
      <rect x="760" y="76" width="368" height="16" fill="#FFFFFF" fill-opacity="0.04"/>
      <line x1="760" y1="92" x2="1128" y2="92" stroke="#FFFFFF" stroke-opacity="0.07"/>
      <circle cx="784" cy="72" r="6" fill="#FF5F57"/>
      <circle cx="804" cy="72" r="6" fill="#FEBC2E"/>
      <circle cx="824" cy="72" r="6" fill="#28C840"/>
      <text x="944" y="76" font-family="'JetBrains Mono',Consolas,monospace" font-size="11" fill="#6C7F95" letter-spacing="1">0x4fmr@kali: ~</text>

      <g font-family="'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace" font-size="15">
        <text x="784" y="126" fill="#42E8C5">$ <tspan fill="#E6EDF3">whoami</tspan></text>
        <text x="784" y="150" fill="#9FB3C8">omar ibrahim // pentester</text>

        <text x="784" y="182" fill="#42E8C5">$ <tspan fill="#E6EDF3">status</tspan></text>
        <text x="784" y="206" fill="#9FB3C8">tryhackme: <tspan fill="#E6EDF3">top 8%</tspan></text>

        <text x="784" y="234" fill="#42E8C5">$ <tspan fill="#E6EDF3"> </tspan></text>
        <rect x="804" y="221" width="9" height="16" fill="#42E8C5">
          <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- Bottom accent line -->
    <rect x="0" y="296" width="1200" height="4" fill="url(#line)"/>
  </g>

  <!-- Border -->
  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="21.5" fill="none" stroke="#42E8C5" stroke-opacity="0.18"/>
</svg>
